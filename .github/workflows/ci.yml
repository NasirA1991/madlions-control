name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cairo appstream desktop-file-utils shellcheck
      - name: Validate metadata and scripts
        run: |
          appstreamcli validate --no-net data/metainfo/io.github.madlionscontrol.MadlionsControl.metainfo.xml
          desktop-file-validate data/io.github.madlionscontrol.MadlionsControl.desktop
          shellcheck install.sh uninstall.sh packaging/appimage/build.sh packaging/flatpak/build.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Byte-compile
        run: python3 -m compileall -q madlions_control

  ui-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 xvfb
      - name: Widget regression tests
        run: |
          xvfb-run -a python3 -m unittest tests.test_widgets -v

      - name: Launch every page in demo mode
        run: |
          set -e
          for page in overview perkey lighting keymap macros advanced test profiles; do
            echo "=== $page ==="
            rm -f "/tmp/$page.log"
            set +e
            timeout 9s xvfb-run -a -s "-screen 0 1400x900x24" \
              env GDK_BACKEND=x11 MADLIONS_NO_TOOLTIPS=1 NO_AT_BRIDGE=1 \
              python3 -m madlions_control --demo --page "$page" >"/tmp/$page.log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 124 ]; then
              echo "App exited before the timeout (status $status)" >&2
              cat "/tmp/$page.log" >&2
              exit 1
            fi
            if grep -q "Traceback" "/tmp/$page.log"; then
              cat "/tmp/$page.log"
              exit 1
            fi
            if grep -E "Gtk-CRITICAL" "/tmp/$page.log" | grep -vE "accessibility bus|a11y|Unable to register the application"; then
              cat "/tmp/$page.log"
              exit 1
            fi
          done
